# main に送る（プッシュする）たびに自動で動きます。
#  1. 書き間違いがないかチェック
#  2. manifest.json のバージョンがまだ公開されていなければ、
#     Chrome・Edge用 / Firefox用 / Safari用 のZIPを作って Releases に公開
#
# 新しい版を出すときは、3つの manifest.json の version を上げて CHANGELOG.md に書き、main に送るだけです。

name: チェックと自動公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 書き間違いチェック
        run: |
          for f in manifest.json firefox/manifest.json safari/manifest.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"
          done
          node --check background.js
          node --check firefox/background.js
          node --check safari/background.js

      - name: ZIPを作る
        run: python3 scripts/build_zip.py

      - name: バージョンを確認
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION は公開済みなので、今回は公開しません"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 更新内容を CHANGELOG.md から取り出す
        if: steps.ver.outputs.publish == 'true'
        run: |
          awk -v v="### ${{ steps.ver.outputs.version }}" '
            (index($0, v "（") == 1 || $0 == v || index($0, v " ") == 1) { on = 1; next }
            on && (/^### / || /^## /) { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md に「### ${{ steps.ver.outputs.version }}」の項目がありません"
            exit 1
          fi
          {
            echo
            echo "---"
            echo "**Chrome・Edge・Brave など**：JufukuTabKeshi.zip を展開して「展開して読み込み」"
            echo "**Firefox**：JufukuTabKeshi-firefox.zip（addons.mozilla.org にそのままアップロードできます）"
            echo "**Safari**：JufukuTabKeshi-safari.zip（Mac の Xcode で変換。手順は README）"
          } >> notes.md
          cat notes.md

      - name: Releases に公開
        if: steps.ver.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            dist/JufukuTabKeshi.zip \
            dist/JufukuTabKeshi-firefox.zip \
            dist/JufukuTabKeshi-safari.zip \
            --title "重複タブ消し ${{ steps.ver.outputs.version }}" \
            --notes-file notes.md \
            --target "${{ github.sha }}" \
            --latest
